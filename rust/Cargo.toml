[package]
name = "floss"
version = "0.1.0"
description = "FLARE Obfuscated String Solver, in Rust"
license = "Apache-2.0"
edition = "2021"

[[bin]]
name = "floss-rs"
path = "src/main.rs"

# IDA only works on the main thread, so these tests have their own harness (libtest-mimic).
[[test]]
name = "ida"
path = "tests/test_ida.rs"
harness = false
required-features = ["ida"]

[[test]]
name = "lancelot"
path = "tests/test_lancelot.rs"
harness = false
required-features = ["lancelot"]

[[example]]
name = "difftest"
required-features = ["lancelot"]

# the program analysis backends, which find the functions and control flow of the program (see src/backend).
# a build has both, and floss-rs picks one when it runs.
#   - ida: IDA Pro, via idalib. needs an IDA installation to build, and uses one when it runs, if there is one.
#   - lancelot: pure Rust. the only backend of builds that can't link to IDA: static binaries and WebAssembly.
# ida-database is the part of ida that reads the program from a database that's open in IDA.
# it's for code that runs inside IDA, which can't use IDA as a library: see ida-plugin.
[features]
default = ["ida", "lancelot"]
ida = ["ida-database", "dep:tempfile", "dep:libc"]
ida-database = ["dep:idalib", "dep:idalib-build"]
lancelot = ["dep:lancelot", "dep:lancelot-flirt"]

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
smallvec = "1"

# zydis: instruction decoding
zydis = { version = "4.1.1", default-features = false, features = ["std", "full-decoder", "nolibc"] }
# idalib: IDA Pro as a library: loading, functions, control flow, FLIRT
idalib = { version = "0.11.1", optional = true }
tempfile = { version = "3", optional = true }
libc = { version = "0.2", optional = true }
# lancelot: PE loading, functions, control flow, FLIRT
lancelot = { git = "https://github.com/williballenthin/lancelot", tag = "v0.10.2", optional = true }
lancelot-flirt = { git = "https://github.com/williballenthin/lancelot", tag = "v0.10.2", optional = true }
# icicle: the emulator (MIT/Apache-2.0); instruction semantics from Ghidra's SLEIGH specs
icicle-vm = { git = "https://github.com/icicle-emu/icicle-emu", rev = "638508b72f480f9be6fe2e267ef09de8f1541f9a" }
pcode = { git = "https://github.com/icicle-emu/icicle-emu", rev = "638508b72f480f9be6fe2e267ef09de8f1541f9a" }
# icicle's SLEIGH compiler, to build the VM from the embedded specifications (see src/emu/sleigh.rs)
sleigh-parse = { git = "https://github.com/icicle-emu/icicle-emu", rev = "638508b72f480f9be6fe2e267ef09de8f1541f9a" }
sleigh-compile = { git = "https://github.com/icicle-emu/icicle-emu", rev = "638508b72f480f9be6fe2e267ef09de8f1541f9a", features = ["ldefs"] }
serde-xml-rs = "0.8"
target-lexicon = "0.13"

# the allocator for static builds: musl's makes floss-rs 70% slower (see src/main.rs).
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
libtest-mimic = "0.8"
tempfile = "3"

[build-dependencies]
idalib-build = { version = "0.11.1", optional = true }
regex = "1"
serde_json = "1"

[profile.release]
debug = 1

# a binary to copy around: no debug information.
[profile.dist]
inherits = "release"
debug = false
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# the build script reads 64MB of win32json.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
