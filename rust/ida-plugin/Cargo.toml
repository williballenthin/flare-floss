[package]
name = "floss-ida-plugin"
version = "0.1.0"
description = "floss-rs as an IDA Pro plugin: extract the obfuscated strings of the open database"
license = "Apache-2.0"
edition = "2021"
publish = false

# the plugin is the cdylib. the rlib is for `cargo test`, which only builds a library that tests can link to.
[lib]
name = "floss_ida"
crate-type = ["cdylib", "rlib"]

[dependencies]
# the program comes from the database that's open in IDA, so no other backend.
floss = { path = "..", default-features = false, features = ["ida-database"] }
# with its plugin feature, idalib is for code that IDA loads, and can't open databases itself.
idalib = { version = "0.11.1", features = ["plugin"] }
log = "0.4"

[build-dependencies]
idalib-build = "0.11.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = 1

# a plugin to copy around: no debug information.
[profile.dist]
inherits = "release"
debug = false
strip = true

# its own workspace, so idalib's plugin feature applies to this build only.
[workspace]
