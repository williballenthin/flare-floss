name: Rust

on:
  push:
    paths:
      - 'rust/**'
      - 'floss/sigs/**'
      - 'tests/data'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'floss/sigs/**'
      - 'tests/data'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash
    working-directory: rust

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the container has glibc 2.28, so the binary runs on a distribution with that version or a later one.
          - os: ubuntu-24.04
            name: linux-x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64:2026.11.07-1
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            container: quay.io/pypa/manylinux_2_28_aarch64:2026.11.07-1
          # with the C runtime in the binary, it runs on a machine without the Visual C++ runtime.
          - os: windows-2025
            name: windows-x86_64
            rustflags: -C target-feature=+crt-static
          - os: macos-15
            name: macos-aarch64
          - os: macos-15-intel
            name: macos-x86_64
    steps:
      - name: Checkout FLOSS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          lfs: true
          persist-credentials: false

      - name: Install build tools
        if: matrix.container
        run: |
          dnf install -y clang clang-devel jq
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      # a build in the container doesn't use the cache of a build on the runner.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.container && 'manylinux_2_28' || '' }}
          workspaces: |
            rust
            rust/ida-plugin

      - name: Test with the lancelot backend
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo test --profile dist --locked --no-default-features --features lancelot

      # one binary has both backends, and uses IDA when IDA is there.
      - name: Build floss-rs
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --profile dist --locked

      - name: Collect floss-rs
        run: |
          case "$RUNNER_OS" in
            Windows) exe=.exe ;;
            *)       exe="" ;;
          esac
          mkdir -p dist/floss-rs
          cp "target/dist/floss-rs$exe" dist/floss-rs/
          ls -l dist/floss-rs

      - name: Run floss-rs without IDA
        run: dist/floss-rs/floss-rs tests/programs/bin/reused-buffer-32-O0.exe | grep "secret key-xyz"

      - name: Upload floss-rs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: floss-rs-${{ matrix.name }}
          path: rust/dist/floss-rs/
          if-no-files-found: error

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.12.6"

      # the archive is what the IDA Plugin Manager installs, for this platform.
      - name: Package the IDA plugin
        env:
          PLATFORM: ${{ matrix.name }}
        run: |
          ida-plugin/package.sh "$PLATFORM" dist/floss
          uv run --no-project python -m zipfile -c "dist/floss-ida-plugin-$PLATFORM.zip" dist/floss/*
          uvx --from ida-hcli hcli plugin lint "dist/floss-ida-plugin-$PLATFORM.zip"

      - name: Upload the IDA plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: rust/dist/floss-ida-plugin-${{ matrix.name }}.zip
          archive: false
          if-no-files-found: error

  web:
    name: Build for the browser
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout FLOSS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          lfs: true
          persist-credentials: false

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
          rustup target add wasm32-wasip1

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust/web

      - name: Build floss_web.wasm
        run: web/build.sh

      - name: Upload the web page
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: floss-rs-web
          path: |
            rust/web/index.html
            rust/web/*.css
            rust/web/*.js
            rust/web/floss_web.wasm
          if-no-files-found: error

  # the IDA tests need the secrets HCLI_API_KEY and IDA_LICENSE_ID, which a pull request from a fork doesn't have.
  ida-secrets:
    name: Look for the IDA secrets
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.look.outputs.present }}
    steps:
      - id: look
        working-directory: .
        env:
          HCLI_API_KEY: ${{ secrets.HCLI_API_KEY }}
          IDA_LICENSE_ID: ${{ secrets.IDA_LICENSE_ID }}
        run: |
          if [ -n "$HCLI_API_KEY" ] && [ -n "$IDA_LICENSE_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

  ida:
    name: Test with IDA on ${{ matrix.os }}
    needs: ida-secrets
    if: needs.ida-secrets.outputs.present == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    steps:
      - name: Checkout FLOSS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          lfs: true
          persist-credentials: false

      # before IDA: its installer sets up IDAPython with the libpython that it finds.
      - name: Install build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev libpython3-dev

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.12.6"

      - name: Install IDA
        run: |
          uv run --no-project --with ida-hcli hcli \
            ida install \
            --download-id "ida-pro:latest" \
            --license-id "${IDA_LICENSE_ID}" \
            --install-dir="${{ runner.temp }}/app/ida" \
            --create-python-environment \
            --accept-eula \
            --set-default \
            --yes
        env:
          HCLI_API_KEY: ${{ secrets.HCLI_API_KEY }}
          IDA_LICENSE_ID: ${{ secrets.IDA_LICENSE_ID }}

      # the plugin's build and the tests find IDA in $IDADIR.
      - name: Set IDADIR
        run: |
          case "$RUNNER_OS" in
            macOS)
              echo "IDADIR=$RUNNER_TEMP/app/ida/Contents/MacOS" >> "$GITHUB_ENV"
              ;;
            Windows)
              echo "IDADIR=$(cygpath -w "$RUNNER_TEMP/app/ida")" >> "$GITHUB_ENV"
              ;;
            *)
              echo "IDADIR=$RUNNER_TEMP/app/ida" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            rust
            rust/ida-plugin

      # the same C runtime as the binary of the build job.
      - name: Test floss-rs
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: |
          IDA_MALWARE_DISABLE_UNPACKER=1 cargo test --release --locked
          cargo build --release --locked

      # without $IDADIR, floss-rs finds the installation that HCLI made the default.
      - name: Run floss-rs with IDA
        run: |
          IDA_MALWARE_DISABLE_UNPACKER=1 target/release/floss-rs --backend ida tests/programs/bin/reused-buffer-32-O0.exe | grep "secret key-xyz"
          env -u IDADIR IDA_MALWARE_DISABLE_UNPACKER=1 target/release/floss-rs --backend ida tests/programs/bin/reused-buffer-32-O0.exe | grep "secret key-xyz"

      - name: Test the IDA plugin
        working-directory: rust/ida-plugin
        run: IDA_MALWARE_DISABLE_UNPACKER=1 cargo test --release --locked
